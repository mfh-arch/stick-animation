<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stick Figure Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        canvas {
            display: block;
            background-color: #0c0c0c;
        }
    </style>
</head>
<body>

    <canvas id="animCanvas"></canvas>

<script>
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');

    // Atur Ukuran Canvas Mengikuti Layar Device
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Warna
    const WHITE = '#ebebeb';
    const GRAY = '#646464';
    const YELLOW = '#ffdc78';
    const GOLD = '#ffd700';

    // Teks Puisi
    const lines = [
        "So tell me, where shall i go?",
        "To the left, where nothing's right?",
        "Or to the right, where nothing's left?"
    ];

    const startTime = Date.now();

    function drawText(centerX) {
        ctx.fillStyle = WHITE;
        ctx.font = "20px 'Comic Sans MS', cursive, sans-serif";
        ctx.textAlign = "center";
        
        let startY = canvas.height * 0.25;
        lines.forEach((line, index) => {
            ctx.fillText(line, centerX, startY + index * 32);
        });
    }

    function drawLanternGlow(x, y, colorRgb = [255, 220, 120]) {
        // Efek Pendaran Lentera
        let radius = 60;
        let gradient = ctx.createRadialGradient(x, y, 2, x, y, radius);
        gradient.addColorStop(0, `rgba(${colorRgb[0]}, ${colorRgb[1]}, ${colorRgb[2]}, 0.9)`);
        gradient.addColorStop(0.5, `rgba(${colorRgb[0]}, ${colorRgb[1]}, ${colorRgb[2]}, 0.3)`);
        gradient.addColorStop(1, `rgba(${colorRgb[0]}, ${colorRgb[1]}, ${colorRgb[2]}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        // Inti Lampu Lentera
        ctx.fillStyle = YELLOW;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 3, y - 5, 6, 8);
    }

    function drawBlessingAura(x, y, progress) {
        let maxR = 90 * progress;
        let gradient = ctx.createRadialGradient(x, y, 2, x, y, maxR);
        gradient.addColorStop(0, `rgba(255, 215, 0, ${0.7 * progress})`);
        gradient.addColorStop(1, `rgba(255, 215, 0, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, maxR, 0, Math.PI * 2);
        ctx.fill();
    }

    function animate() {
        let t_raw = (Date.now() - startTime) / 1000.0;
        let totalCycleTime = 11.0;
        let t = t_raw % totalCycleTime; // RAHASIA LOOPING

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let centerX = canvas.width / 2;
        let groundY = canvas.height * 0.65;

        // 1. Gambar Teks Puisi
        drawText(centerX);

        // 2. Gambar Garis Tanah
        ctx.strokeStyle = GRAY;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 150, groundY);
        ctx.lineTo(centerX + 150, groundY);
        ctx.stroke();

        // Timeline Parameter
        let t_walk_right_end = 2.5;
        let t_walk_left_end = 5.0;
        let t_pause_end = 6.0;
        let t_kneel_end = 8.5;

        let charX = centerX;
        let facingRight = true;
        let stepSwing = 0;
        let lanternSwing = 0;
        let kneelP = 0.0;
        let blessingProgress = 0.0;
        let charColor = WHITE;

        if (t < t_walk_right_end) {
            let progress = t / t_walk_right_end;
            charX = (centerX - 60) + progress * 120;
            facingRight = true;
            stepSwing = Math.sin(t * 8) * 12;
            lanternSwing = Math.sin(t * 4) * 6;
        } else if (t < t_walk_left_end) {
            let progress = (t - t_walk_right_end) / (t_walk_left_end - t_walk_right_end);
            charX = (centerX + 60) - progress * 60;
            facingRight = false;
            stepSwing = Math.sin(t * 8) * 12;
            lanternSwing = Math.sin(t * 4) * 6;
        } else if (t < t_pause_end) {
            charX = centerX;
            facingRight = true;
        } else if (t < t_kneel_end) {
            charX = centerX;
            facingRight = true;
            kneelP = (t - t_pause_end) / (t_kneel_end - t_pause_end);
        } else {
            charX = centerX;
            facingRight = true;
            kneelP = 1.0;
            blessingProgress = Math.min(1.0, (t - t_kneel_end) / 1.5);
            charColor = GOLD;
        }

        // Posisi Sendi (Berlutut Tegak Khidmat)
        let hipX = charX - (5 * kneelP);
        let hipY = (groundY - 30) + (10 * kneelP);

        let neckX = hipX; // Tegak lurus di atas pinggul
        let neckY = hipY - 35;

        let headX = neckX;
        let headY = neckY - 15;

        ctx.strokeStyle = charColor;
        ctx.lineWidth = 2;

        // Kepala
        ctx.beginPath();
        ctx.arc(headX, headY, 12, 0, Math.PI * 2);
        ctx.stroke();

        // Badan Tegak
        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        // Kaki
        if (kneelP === 0.0) {
            let dirMult = facingRight ? 1 : -1;
            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(hipX + stepSwing * dirMult, groundY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(hipX - stepSwing * dirMult, groundY);
            ctx.stroke();
        } else {
            // Kaki Depan (Paha Horisontal 90 Derajat)
            let frontKneeX = hipX + (22 * kneelP);
            let frontKneeY = hipY;
            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(frontKneeX, frontKneeY);
            ctx.lineTo(frontKneeX, groundY);
            ctx.stroke();

            // Kaki Belakang (Lutut Menempel Tanah)
            let backKneeX = hipX - (5 * kneelP);
            let backFootX = backKneeX - (20 * kneelP);
            ctx.beginPath();
            ctx.moveTo(hipX, hipY);
            ctx.lineTo(backKneeX, groundY);
            ctx.lineTo(backFootX, groundY);
            ctx.stroke();
        }

        // Tangan & Lentera
        let handX, handY, lanternX, lanternY;
        if (kneelP === 0.0) {
            let armDir = facingRight ? 18 : -18;
            handX = neckX + armDir;
            handY = neckY + 15 + lanternSwing;

            ctx.beginPath();
            ctx.moveTo(neckX, neckY);
            ctx.lineTo(handX, handY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(neckX, neckY);
            ctx.lineTo(neckX - armDir * 0.6, neckY + 20);
            ctx.stroke();

            lanternX = handX + (facingRight ? 5 : -5);
            lanternY = handY + 15;
        } else {
            handX = neckX + (15 * kneelP);
            handY = neckY + (15 * kneelP);

            ctx.beginPath();
            ctx.moveTo(neckX, neckY);
            ctx.lineTo(handX, handY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(neckX, neckY);
            ctx.lineTo(handX - 3, handY + 3);
            ctx.stroke();

            lanternX = handX + 2;
            lantern_y = handY + 18;
        }

        // Tali Lentera & Glow
        ctx.beginPath();
        ctx.moveTo(handX, handY);
        ctx.lineTo(lanternX, lanternY - 5);
        ctx.stroke();

        drawLanternGlow(lanternX, lanternY);

        // Aura Berkah Emas
        if (blessingProgress > 0) {
            drawBlessingAura(headX, headY - 15, blessingProgress);
        }

        requestAnimationFrame(animate);
    }

    // LANGSUNG JALAN OTOMATIS TANPA KLIK!
    animate();
</script>
</body>
</html>
